[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "-ra",
  "--strict-markers",
  "-p",
  "no:langsmith",
  "--cov=.",
  "--cov-report=term-missing",
  "--cov-report=html:htmlcov",
  "--cov-report=xml:coverage.xml",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore:Could not obtain an event loop:UserWarning",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  "tests/*",
  ".venv/*",
  "htmlcov/*",
  "*/site-packages/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]
fail_under = 90
